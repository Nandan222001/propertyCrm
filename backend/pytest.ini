[pytest]
testpaths = tests
# `pytest` (console script) does not put the CWD on sys.path the way
# `python -m pytest` does; without this the `app` package cannot be imported
# from tests/conftest.py (pytest exits 4 before running a single test).
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --disable-warnings --maxfail=5
filterwarnings =
    ignore::DeprecationWarning
markers =
    security: security-focused tests
    slow: slower end-to-end checks
