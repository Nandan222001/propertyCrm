# =============================================================================
# Security gates. Every job is a required check: a finding blocks the merge
# instead of becoming a ticket nobody reads. CodeQL and the dependency-review
# action require GitHub Advanced Security, which is not available on this
# private repository, so SAST is enforced with Semgrep (OSS rules) instead and
# the dependency review job only runs where the repository allows it; private
# repos are covered by the pip-audit / npm-audit jobs in ci.yml.
# =============================================================================
name: Security

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # weekly drift scan (new CVEs against unchanged code)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid GITLEAKS_LICENSE on private repos,
      # so run the official binary directly; .gitleaksignore is honoured.
      - name: Gitleaks (full history, redacted)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --verbose --no-banner

  dependency-review:
    name: Dependency review (PRs)
    # dependency-review-action reads the dependency graph, a GitHub Advanced
    # Security feature: on private repos the API returns 403 and the job can
    # never pass. Public forks/exports run it; private ones rely on pip-audit.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, SSPL-1.0

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Semgrep scan (secrets + CI rules, fail on findings)
        run: |
          pip install "semgrep==1.179.0"
          semgrep scan --config p/ci --config p/secrets --error \
            --metrics=off backend/app backend/migrations src scripts

  container-scan:
    name: Container scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        # --no-cache: a scan must never see layers cached from an older build
        run: docker build --no-cache -t lalita-erp-api:scan ./backend
      - name: Trivy table summary (visibility, never fails the job)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed \
            --scanners vuln \
            --skip-dirs "/opt/venv/lib/python3.12/site-packages/pip/_vendor,/usr/local/lib/python3.12/site-packages/pip/_vendor" \
            lalita-erp-api:scan || true
      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lalita-erp-api:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          # the gate runs trivy inside a container that cannot see the
          # workspace, so the ignore file must be mounted explicitly
          trivyignores: .trivyignore
          # Secret scanning of the baked image is deliberately off: the hits
          # are by-design placeholders (create_db.sql's CHANGE_ME MySQL
          # password, config.py's local-only SECRET_KEY fallback), and real
          # source secrets are enforced by the gitleaks job above.
          # pip also vendors old msgpack/urllib3 inside its own _vendor
          # directory — package-manager internals, not runtime dependencies.
          skip-dirs: "/opt/venv/lib/python3.12/site-packages/pip/_vendor,/usr/local/lib/python3.12/site-packages/pip/_vendor"
      # no SARIF upload: code scanning (GHAS) is not enabled on this private
      # repository; the exit-code gate above is the enforcement point.

  iac-scan:
    name: IaC scan (terraform fmt/validate/tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      - name: Format check
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/terraform
          soft_fail: false

  config-drift:
    name: Config drift (schedule only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit (runtime + dev)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
          pip-audit -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm audit (full report)
        run: npm audit --audit-level=moderate || true
