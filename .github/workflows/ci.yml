# =============================================================================
# Continuous integration: build the SPA, render it, and run the API test suite
# against a real MySQL-protocol server where possible.
# =============================================================================
name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: API · lint + tests (MySQL dialect)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DB_DIALECT: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: lalita_erp
      DB_USER: lalita_app
      DB_PASSWORD: ci-db-password
      DB_SSL_MODE: disabled
      SECRET_KEY: example-ci-only-not-a-real-secret
      INDEX_PEPPER: ci-index-pepper
      FIELD_ENCRYPTION_KEY: ci-field-encryption-key
      LOG_JSON: 'false'
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci-password
          MYSQL_DATABASE: lalita_erp
          MYSQL_USER: lalita_app
          MYSQL_PASSWORD: ci-db-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Apply migrations (Alembic)
        run: alembic upgrade head

      - name: Verify migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Test suite
        run: pytest tests -q --maxfail=0

      - name: SAST (bandit)
        run: bandit -c bandit.yaml -r app -q

      - name: Dependency scan (pip-audit)
        run: pip-audit -r requirements.txt --strict

  frontend:
    name: SPA · build + render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Render smoke test (all roles)
        run: npm run smoke

      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

  migrations-mysql-offline:
    name: API · offline MySQL DDL render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Render MySQL DDL without a database
        env:
          ENVIRONMENT: test
          DB_DIALECT: mysql
          DB_PASSWORD: render-only
          SECRET_KEY: example-ci-only-not-a-real-secret
          INDEX_PEPPER: ci-pepper
          FIELD_ENCRYPTION_KEY: ci-field-key
        run: alembic upgrade head --sql > /tmp/schema.sql && ! grep -qi 'sqlite' /tmp/schema.sql
